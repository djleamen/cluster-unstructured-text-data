[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-text"
version = "0.1.0"
description = "Cluster unstructured text data with K-Means / DBSCAN."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.5"]
ui = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4"]

[project.scripts]
cluster-text = "cluster_text.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
